[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-hawdb"
version = "0.23.0"
description = "SQLAlchemy dialect for the embedded HawDB database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["SQLAlchemy>=2.0,<3.0", "hawdb>=0.23.0,<0.24.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.entry-points."sqlalchemy.dialects"]
hawdb = "sqlalchemy_hawdb.dialect:HawDBDialect"

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["sqlalchemy_hawdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
